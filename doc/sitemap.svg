  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#6E5547">Noble Family Church Rwanda · 3 page types · header nav + footer on every page</text>

  <!-- links -->
  <g stroke="#7B4A2D" stroke-width="2.5" fill="none">
    <path d="M500 150 V200 M210 200 H790 M210 200 V240 M500 200 V240 M790 200 V240"/>
    <path d="M500 330 V380 M130 380 H870"/>
    <path d="M130 380 V420 M253 380 V420 M376 380 V420 M500 380 V420 M623 380 V420 M746 380 V420 M870 380 V420"/>
  </g>

  <!-- level 1 -->
  <rect x="380" y="90" width="240" height="60" rx="12" fill="#3B1F12"/>
