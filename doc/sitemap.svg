<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Poppins, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">StoryCast sitemap</title>
  <desc id="d">Home links to seven story detail pages and to the About and Access page. Every page shares the header navigation and footer. Story pages link to each other through related stories and previous/next links.</desc>
  <rect width="1000" height="640" fill="#FAF5EF"/>
